<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="login-page" class="flex-col flex md:mt-0 mt-6 md:flex-row justify-between items-center h-screen px-[20px] gap-y-[20px] text-left">
        <div class="flex flex-col justify-between gap-y-[20px] text-left">
            <h1 class="font-bold text-7xl text-left"><span class="text-blue-500">English</span> is Easy!!</h1>
            <p>
                আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি <br>
                নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive <br>
                Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ
            </p>
            
            <form class="flex flex-col md:items-start items-center py-[10px] gap-y-[10px]" action="">
                <div class="flex relative">
                    <input id="username" class="text-center border w-[200px] rounded-[5px] placeholder:text-center" type="text" placeholder="Username">
                    <svg class="relative right-48 top-1.5" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 18V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.0693 2.81985L3.13929 8.36985C2.35929 8.98985 1.85929 10.2998 2.02929 11.2798L3.35929 19.2398C3.59929 20.6598 4.95929 21.8098 6.39929 21.8098H17.5993C19.0293 21.8098 20.3993 20.6498 20.6393 19.2398L21.9693 11.2798C22.1293 10.2998 21.6293 8.98985 20.8593 8.36985L13.9293 2.82985C12.8593 1.96985 11.1293 1.96985 10.0693 2.81985Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>

                <div class="flex relative">
                    <input id="password" class="text-center border w-[200px] rounded-[5px] placeholder:text-center" type="password" placeholder="Password">
                    <svg class="relative right-48 top-1.5" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 18V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.0693 2.81985L3.13929 8.36985C2.35929 8.98985 1.85929 10.2998 2.02929 11.2798L3.35929 19.2398C3.59929 20.6598 4.95929 21.8098 6.39929 21.8098H17.5993C19.0293 21.8098 20.3993 20.6498 20.6393 19.2398L21.9693 11.2798C22.1293 10.2998 21.6293 8.98985 20.8593 8.36985L13.9293 2.82985C12.8593 1.96985 11.1293 1.96985 10.0693 2.81985Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
            </form>
            <div class="flex md:justify-start md:mr-0 mr-5 justify-center">
            <button id="get-started" class="bg-blue-600 hover:bg-blue-400 text-white font-bold text-[12px] mt-[10px] w-[80px] h-[30px] rounded-[5px]">Get started</button>
            </div>
        </div>
        <div>
            <img class="w-[400px] h-auto" src="https://english-janala-web11-2729.surge.sh/assets/hero-student.png" alt="">
        </div>
    </div>

    <!-- popup -->
    <dialog id="welcome_modal" class="absolute left-[50px] md:left-[490px] top-[250px] modal rounded-[20px] h-[150px]">
        <div class="modal-box text-center w-[300px] pt-[20px]">
            <h3 class="text-2xl font-semibold">অভিনন্দন!</h3>
            <p class="py-4">চলুন আজ নতুন কিছু শেখা যাক</p>
            <button class="btn btn-primary bg-blue-400 w-[50px] rounded-sm" onclick="this.closest('dialog').close()">OK</button>
        </div>
    </dialog>

    <!-- dashboard -->
    <section id="dashboard" class="" hidden>
        <header class="flex justify-between border p-[20px] bg-white sticky">
            <div class="flex items-center">
                <h1 class=" text-2xl">ENGLISH</h1>
                <img src="images/logo.png" alt="">
                <h1 class=" text-2xl font-semibold">জানালা</h1>
            </div>
            <div class="md:flex justify-between px-10 mx-5 gap-5 w-[35%] hidden">
                <button class="border flex items-center justify-center gap-[10%] w-[45%] border-blue-600 rounded-[5px] hover:bg-blue-500 hover:text-white"><img class="size-[12px]" src="images/fa-book-open.png" alt="">FAQ</button>
                <button class="border flex items-center justify-center gap-[10%] w-[45%] border-blue-600 rounded-[5px] hover:bg-blue-500 hover:text-white"><img class="size-[12px]" src="images/fa-book-open.png" alt="">LEARN</button>
                <button class="border flex items-center justify-center gap-[10%] w-[45%] border-blue-600 rounded-[5px] hover:bg-blue-500 hover:text-white"><img class="size-[12px]" src="images/fa-book-open.png" alt="">LOGOUT</button>
            </div>
        </header>
        
        <!-- api calling with buttons section -->
        <div class="flex flex-col">
            <h1 class="text-4xl font-semibold m-10 text-center"><span class="text-blue-700">Let's</span> learn vocabularies</h1>
            <div id="lesson-container" class="grid grid-cols-3 justify-items-center md:flex md:flex-row justify-around items-center gap-y-[20px] md:px-[80px]">
            </div>
        </div>

        <div id="word-container" class="grid grid-cols-1 md:grid-cols-3 md:mx-[60px] mt-[40px] gap-y-[20px] bg-gray-100 justify-items-center pt-[50px]">

        </div>

        
    </section>

  </body>
</html>
